<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Geometry Dash - Play Level 1</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; }
        canvas { display: block; margin: 0 auto; }
    </style>
</head>
<body>

    <!-- Vendor: official Phaser 3.90.0 build (unmodified) -->
    <script src="assets/vendor/phaser.min.js"></script>

    <!-- Game source, split into logical modules. These are plain classic
         scripts (no type="module"), loaded in dependency order so that
         top-level `let`/`const`/`class`/`function` declarations in each
         file are visible to the files loaded after it, exactly like the
         original single-file bundle. -->
    <script src="src/constants.js"></script>
    <script src="src/boot-scene.js"></script>
    <script src="src/font-helpers.js"></script>
    <script src="src/player-physics-state.js"></script>
    <script src="src/level-data-helpers.js"></script>
    <script src="src/pako-compression.js"></script>
    <script src="src/level-renderer.js"></script>
    <script src="src/trail-renderer.js"></script>
    <script src="src/sprite-layer-helper.js"></script>
    <script src="src/player.js"></script>
    <script src="src/tween-value.js"></script>
    <script src="src/color-manager.js"></script>
    <script src="src/audio-manager.js"></script>
    <script src="src/game-scene.js"></script>
    <script src="src/win-effects.js"></script>
    <script src="src/main.js"></script>

    <script>
      // ResizeObserver catches iframe size changes that window.resize misses
      // (e.g. parent window maximize, snap, title bar drag)
      new ResizeObserver(() => {
        window.dispatchEvent(new Event('resize'));
      }).observe(document.documentElement);
    </script>
</body>
</html>
